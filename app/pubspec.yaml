name: ant_manager
description: "Ant Manager desktop app."
publish_to: 'none'
resolution: workspace
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  core:
    path: ../packages/core
  ui:
    path: ../packages/ui
  flutter_riverpod: ^3.5.0
  window_manager: ^0.6.0
  tray_manager: ^0.8.3
  hotkey_manager: ^0.3.0
  launch_at_startup: ^0.5.1
  local_notifier: ^0.1.6
  flutter_secure_storage: ^10.3.4
  path_provider: ^2.1.6
  auto_updater: ^1.0.0
  url_launcher: ^6.3.3
  file_selector: ^1.1.0
  drift: ^2.35.4
  path: ^1.9.1
  pdf: ^3.13.1
  desktop_drop: ^0.8.4
  dio: ^5.11.1
  package_info_plus: ^9.0.1
  flutter_svg: ^2.5.0

dev_dependencies:
  archive: ^4.7.1
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tray/
    - assets/brand/
