name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.9

jobs:
  test:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # `flutter test` runs native-asset build hooks (cnativeapi: pkg-config gtk+-3.0, x11, xi).
      - name: Install Linux desktop deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev libx11-dev libxi-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Pub get (workspace)
        run: flutter pub get

      - name: Generated code is committed
        if: ${{ !cancelled() }}
        working-directory: packages/core
        run: |
          dart run build_runner build --delete-conflicting-outputs
          if [ -n "$(git status --porcelain -- .)" ]; then
            git status --porcelain -- .
            git diff -- .
            echo "::error::Generated code is out of date. Run build_runner in packages/core and commit the result."
            exit 1
          fi

      - name: core - analyze
        if: ${{ !cancelled() }}
        run: dart analyze packages/core

      - name: core - test
        if: ${{ !cancelled() }}
        working-directory: packages/core
        run: dart test --exclude-tags live

      - name: ui - analyze
        if: ${{ !cancelled() }}
        working-directory: packages/ui
        run: flutter analyze

      - name: ui - test
        if: ${{ !cancelled() }}
        working-directory: packages/ui
        run: flutter test

      - name: ui - design tokens check
        if: ${{ !cancelled() }}
        run: dart run packages/ui/tool/check_tokens.dart

      - name: app - analyze
        if: ${{ !cancelled() }}
        working-directory: app
        run: flutter analyze

      - name: app - test
        if: ${{ !cancelled() }}
        working-directory: app
        run: flutter test
