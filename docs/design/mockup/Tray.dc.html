<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ant Manager — Menu bar</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.tr button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:left}
.mi{display:flex;align-items:center;gap:10px;width:100%;height:32px;padding:0 10px;border-radius:var(--r-md);box-sizing:border-box;color:var(--text-2)}
.mi:hover{background:var(--active);color:var(--text)}
.kbd{margin-left:auto;font-family:var(--font-mono);font-size:10.5px;color:var(--muted)}
.sep{height:1px;background:var(--divider);margin:4px 6px}
.label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 10px 4px}
</style>
</helmet>
<div class="ant" data-theme="{{theme}}" style="width: 360px; height: 540px; box-sizing: border-box; padding: 0 20px 20px; background: var(--bg-sidebar)">
  <div style="height: 28px; display: flex; align-items: center; justify-content: flex-end; gap: 16px; padding: 0 4px; color: var(--text-soft); font-size: 12px">
    <span style="display: flex; align-items: center; justify-content: center; width: 26px; height: 22px; border-radius: var(--r-sm); background: var(--active)">
      <svg width="16" height="16" viewBox="0 0 24 24" aria-label="Ant Manager menu" role="img"><ellipse cx="7.5" cy="16" rx="4" ry="3" transform="rotate(-40 7.5 16)" fill="var(--text)"></ellipse><circle cx="12.2" cy="11.6" r="1.6" fill="var(--text)"></circle><circle cx="15.8" cy="8.2" r="2.6" fill="var(--text)"></circle><path d="M16.5 5.8l1-3M18 7.4l3-.8M11 10.3l-3-1.8M13.4 13l1.2 3.4" stroke="var(--text)" stroke-width="1.3" stroke-linecap="round" fill="none"></path></svg>
    </span>
    <span>Wed 18 Nov 18:06</span>
  </div>
  <div class="tr" style="margin-top: 6px; background: var(--raised); border: 1px solid var(--border-stronger); border-radius: var(--r-xl); box-shadow: var(--shadow); padding: 6px; font-size: 13px">
    <div style="margin: 4px 4px 8px; padding: 12px; border-radius: var(--r-lg); background: color-mix(in srgb, var(--accent) 10%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent)">
      <div style="font-weight: 600; color: var(--text)">Your day is drafted</div>
      <div style="color: var(--text-soft); font-size: 12px; margin: 2px 0 10px">9 items · 3 projects · 1 suggested win</div>
      <div style="display: flex; gap: 6px">
        <a href="Main.dc.html" style="display: inline-flex; align-items: center; height: 28px; padding: 0 12px; border-radius: var(--r-md); background: var(--accent); color: var(--on-accent); font-weight: 500; font-size: 12.5px; text-decoration: none">Review (2 min)</a>
        <button onClick="{{snooze}}" style="height: 28px; padding: 0 10px; border-radius: var(--r-md); color: var(--text-soft); font-size: 12.5px">{{snoozeLabel}}</button>
      </div>
    </div>
    <a class="mi" href="Main.dc.html" style="text-decoration: none">Open Ant Manager<span class="kbd">⌘O</span></a>
    <a class="mi" href="QuickCapture.dc.html" style="text-decoration: none">Quick note…<span class="kbd">⌥⌘N</span></a>
    <div class="sep"></div>
    <div class="label">Profile</div>
    <sc-for list="{{profiles}}" as="p" hint-placeholder-count="2">
      <button class="mi" onClick="{{p.pick}}"><span style="width: 14px; color: var(--accent-text)">{{p.check}}</span>{{p.name}}</button>
    </sc-for>
    <div class="sep"></div>
    <button class="mi" onClick="{{sync}}">{{syncLabel}}</button>
    <div style="padding: 2px 10px 6px 34px; font-size: 11.5px; color: var(--muted)">Last sync 2 min ago · Backup today 02:00</div>
    <button class="mi" style="color: var(--accent-text)"><span style="width: 6px; height: 6px; border-radius: 50%; background: var(--accent)"></span>Jira token expires in 5 days</button>
    <div class="sep"></div>
    <button class="mi" onClick="{{togglePause}}">{{pauseLabel}}</button>
    <button class="mi">Settings…<span class="kbd">⌘,</span></button>
    <button class="mi">Quit Ant Manager<span class="kbd">⌘Q</span></button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark","section":"Design tokens"},"$preview":{"width":360,"height":540}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { profile: 'Work', snoozed: false, paused: false, syncing: false }; }
  componentWillUnmount() { clearTimeout(this._t); }
  renderVals() {
    const s = this.state;
    const profiles = ['Work', 'Side projects'].map(n => ({ name: n, check: s.profile === n ? '✓' : '', pick: () => this.setState({ profile: n }) }));
    return {
      theme: this.props.theme === 'light' ? 'light' : 'dark', profiles,
      snoozeLabel: s.snoozed ? 'Snoozed 1 h' : 'Snooze',
      snooze: () => this.setState({ snoozed: !s.snoozed }),
      syncLabel: s.syncing ? 'Syncing…' : 'Sync now',
      sync: () => { this.setState({ syncing: true }); clearTimeout(this._t); this._t = setTimeout(() => this.setState({ syncing: false }), 1500); },
      pauseLabel: s.paused ? 'Resume collection' : 'Pause collection for today',
      togglePause: () => this.setState({ paused: !s.paused })
    };
  }
}
</script>
</body>
</html>
